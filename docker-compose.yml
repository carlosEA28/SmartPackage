services:
  mysql:
    image: mysql:8.4
    container_name: smartpackage-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: smartpackage
      MYSQL_USER: smartpackage_user
      MYSQL_PASSWORD: smartpackage_password
      MYSQL_ROOT_PASSWORD: smartpackage_root_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
